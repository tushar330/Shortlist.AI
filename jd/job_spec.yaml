ideal_candidate_paragraph: 'How to read between the lines The "ideal candidate" we''re imagining is roughly:
  6-8 years total experience, of which 4-5 are in applied ML/AI roles at product companies (not pure services).
  Has shipped at least one end-to-end ranking, search, or recommendation system to real users at meaningful
  scale. Has strong opinions about retrieval (hybrid vs dense), evaluation (offline vs online), and LLM
  integration (when to fine-tune vs prompt) — and can defend them with reference to systems they actually
  built. Located in or willing to relocate to Noida or Pune. Active on Redrob platform (or has clear signal
  of being in the job market) so we can actually talk to them. We are aware this is a narrow profile.
  We''re not expecting to find many matches in a 100K candidate pool. We''re explicitly OK with that —
  we''d rather see 10 great matches than 1000 maybes. Final note for the participants of the Redrob hackathon
  If you''re reading this in the context of the Intelligent Candidate Discovery & Ranking Challenge: The
  "right answer" to this JD is not "find candidates whose skills section contains the most AI keywords."

# Disqualifier detectors the platform knows how to evaluate against a candidate.
# The JD compiler activates a detector when the JD's "do not want" language
# matches its cues; JDs without such language leave the detector off.
disqualifier_detectors:
  research_only:
    label: "Pure research career without production deployment"
    jd_cues: [pure research, academic lab, research-only, research labs, without any production deployment]
  recent_wrapper_only:
    label: "AI experience limited to recent thin LLM-API work"
    jd_cues: [langchain to call, under 12 months, recent (under, wrapper, call openai]
  non_coding_architect:
    label: "No hands-on production code in recent role"
    jd_cues: [hasn't written production code, architecture” roles, tech lead” roles, this role writes code]
  title_chaser:
    label: "Company-hopping optimized for title escalation"
    jd_cues: [title-chasers, switching companies every, optimizing for]
  framework_enthusiast:
    label: "Framework tutorials over systems thinking"
    jd_cues: [framework enthusiasts, langchain tutorials, hot framework]
  consulting_only:
    label: "Entire career at IT services / consulting firms"
    jd_cues: [consulting firms, tcs, infosys, wipro, accenture, cognizant, capgemini]
  cv_speech_only:
    label: "CV/speech/robotics specialism without NLP/IR exposure"
    jd_cues: [computer vision, speech, robotics, without significant nlp]
  closed_source_no_validation:
    label: "Long closed-source career with no external validation"
    jd_cues: [closed-source proprietary, without external validation]

